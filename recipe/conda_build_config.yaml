# Use clang_bootstrap for macOS self-hosted builds
c_compiler:
  - clang_bootstrap     # [osx]
cxx_compiler:
  - clang_bootstrap     # [osx]

# Build with the clang 23 compiler (LLVM 23 chain: after clang-compiler-activation 23)
c_compiler_version:
  - 23.1.4              # [osx]
cxx_compiler_version:
  - 23.1.4              # [osx]
